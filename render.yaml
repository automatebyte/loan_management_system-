services:
  - type: web
    name: kreditai-backend
    env: python
    buildCommand: |
      cd backend &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py create_demo_data
    startCommand: cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kreditai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kreditai-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://kreditai-frontend.onrender.com,https://kreditai.com

  - type: web
    name: kreditai-frontend
    env: static
    buildCommand: |
      cd frontend &&
      npm ci &&
      npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://kreditai-backend.onrender.com

  - type: redis
    name: kreditai-redis
    ipAllowList: []

databases:
  - name: kreditai-postgres
    databaseName: kreditai_db
    user: kreditai_user